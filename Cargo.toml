[package]
name = "pirata"
version = "0.1.1"
edition = "2024"
description = "Torrent CLI with a TUI-first search and download flow"
license = "MIT"
authors = ["Cesar Ferreira"]
repository = "https://github.com/cesarferreira/pirata"
homepage = "https://github.com/cesarferreira/pirata"
readme = "README.md"
keywords = ["torrent", "tui", "cli", "aria2"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.1"
crossterm = "0.28"
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
directories = "6.0"
indicatif = "0.17"
nix = { version = "0.31.3", features = ["term"] }
open = "5.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "deflate", "gzip", "json", "rustls-tls"] }
scraper = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
tokio = { version = "1.45", features = ["fs", "macros", "net", "process", "rt-multi-thread", "time"] }
toml = "0.8"
urlencoding = "2.1"
