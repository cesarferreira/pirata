name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Test native target
        run: cargo test --locked --all-targets --target ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Verify binary version
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/pirata"
          "$binary" --version
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$("$binary" --version)" = "pirata ${GITHUB_REF_NAME#v}"
          fi
      - name: Package Linux binary
        env:
          TARGET: ${{ matrix.target }}
        run: tar -czf "pirata-$TARGET.tar.gz" -C "target/$TARGET/release" pirata
      - uses: actions/upload-artifact@v7
        with:
          name: pirata-${{ matrix.target }}
          path: pirata-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify all release artifacts and generate checksums
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            test -s "artifacts/pirata-$target.tar.gz"
            tar -tzf "artifacts/pirata-$target.tar.gz" | grep -qx pirata
          done
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS
      - name: Extract release notes
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          lines = Path('CHANGELOG.md').read_text().splitlines(keepends=True)
          start = next(i for i, line in enumerate(lines) if line.startswith(f'## [{version}]'))
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith('## [')), len(lines))
          Path('release-notes.md').write_text(''.join(lines[start + 1:end]).strip() + '\n')
          PY
      - name: Publish release and binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "pirata $GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --title "pirata $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
